  - id: teleop.bridge
    name: Teleop bridge daemon
    type: Service
    path: drive/bridge/
    plane: edge
    role: Vehicle-side WebSocket daemon; auth, watchdog state machine, VehicleAdapter (mock, and the ugv01 shim over edge.hal.ugv01), optional LINK reporter
    status: software_verified
    disposition: refactor
    tests: [tests/test_bridge_daemon.py, tests/test_ugv01_bridge_adapter.py, tests/test_contract_brake.py]
    known_gaps:
      - Own JSON wire contract and own vehicle abstraction, parallel to the HAL
      - The ugv01 adapter's self-test keeps stop_on_link_loss false, so the daemon cannot arm on the real vehicle until the section 6 gate is proven (13 Oct 2026)
      - Telemetry the boards cannot supply (speed, battery, heading, temperature) is sent as zero because the contract has no unknown; the cockpit must learn an unknown before this drives a real HUD
    notes: Convergence direction (ADR-0009) makes its VehicleAdapter a shim over the HAL locomotion driver so exactly one process owns the hardware. Do not build the real MCU adapter twice. 18 Aug 2026, the software half of ADR-0009 point 4 landed, per-operator tokens (drive/bridge/identity.py) and an append-only session log (drive/bridge/session_log.py) from which a session is reconstructed in CI; the old relay (argus_relay.py) still runs on the shared password and retires at convergence.

  - id: teleop.relay
    name: Bridge relay
    type: Service
    path: drive/bridge/argus_relay.py
    plane: edge
    role: Stdlib-only relay for driving over a routed link
    status: hardware_integrated
    disposition: refactor
    evidence:
      hardware_runs:
        - "2026-08: ran on the Jetson AGX Orin over a 271 ms relayed link, 30 s at 15 Hz, zero watchdog latches, no frame loss, 0.4 percent CPU (recorded in docs/architecture/audits/2026-08-17-as-built-audit.md section 3 and in pre-graph STATUS.md git history). Network path only; no vehicle actuation involved."
    known_gaps:
      - Exposes live drive control via Tailscale Funnel behind one static password sent as the first frame

  - id: teleop.cockpit
    name: Teleop cockpit
    type: Application
    path: drive/cockpit/
    plane: platform
    role: Browser driving UI; gamepad and keyboard, ignition control, HUD telemetry; runs standalone or inside C2's Drive frame
    status: software_verified
    disposition: refactor
    tests: [drive/cockpit/src/cockpit/CockpitScreen.test.tsx, drive/cockpit/src/cockpit/CockpitScreen.link.test.tsx, drive/cockpit/src/input/release.test.ts, drive/cockpit/src/transport/useBridgeTransport.test.ts, drive/cockpit/src/transport/useRemoTransport.test.ts, drive/cockpit/src/state/store.test.ts, drive/cockpit/src/embed/driveActive.test.ts]
    known_gaps:
      - No video pane
      - Inside C2 it is proven by tests only; not yet driven in a real browser inside C2
    notes: Rebuilt for C2 M3 on the shared design tokens (design/). When embedded, it commands the vehicle only while C2 says Drive is the active screen (drive/cockpit/src/embed/driveActive.ts). Leaving Drive drops the arm and stops commanding; the operator must return and arm again. Only the parent window may send that message, and an embedded cockpit that has heard nothing is inactive. The embed module is the single source of truth; the store and the transports read it and act in the same turn as the message. C2's sign-out message disarms, forgets the stored key, and closes the socket cleanly, then the cockpit answers argus.drive.signout.done at the framer's origin; C2 keeps the frame mounted until that answer or 500 ms. An arm press is a momentary request. It is refused unless Drive is active, the stick is neutral, and on a bridge link fresh telemetry reads ignition on and a passed self-test. It is asserted for 500 ms until the vehicle confirms DRIVING, then held only while it reads DRIVING. While it is pending, outgoing frames carry zero throttle and the steer unchanged; throttle passes only after the DRIVING reading. STOPPED readings during the window are normal, and so is a latch that was already there at the press; a reading that moves to LATCHED, or an unknown state, ends the request at once. A bridge link is live only while telemetry is fresh; silence past the vehicle's declared watchdog window (1000 ms if undeclared) is treated as link loss, which drops the arm and the ignition command and needs a fresh arm. While the link is down the HUD shows no values. Lint clean; its own CI job. Manual teleop remains a permanent fallback capability in the target architecture, converged onto one contract and one safety story.

  - id: teleop.watchdog
    name: Teleop watchdog
    type: Component
    path: drive/bridge/watchdog.py
    plane: edge
    role: STOPPED / DRIVING / LATCHED; 700 ms silence, a 700 ms command gap, or link loss latches a safe stop, arm and re-arm always explicit
    status: software_verified
    disposition: keep
    tests: [tests/test_bridge_daemon.py]
    known_gaps:
      - Mock-tested only; hardware validation pending, and the layer below it (MCU firmware) is not yet failsafe
    notes: Arming is a rising edge of the operator's arm bit, never a level. A frame that only continues arm=true never arms, so frames queued in a stalled socket cannot re-arm a latch when they drain. A session starts as if the arm were held and needs one arm=false frame before a press counts. Every latch (estop, silence, link loss) resets the detector the same way. A press made before the self-test passed is spent. Every arm, first or re-arm, needs zero throttle; the bridge does not trust the cockpit's neutral-stick gate. The self-test verdict is a required argument, so a caller cannot fail open by leaving it out. While DRIVING, a held arm is idempotent, which the cockpit's 500 ms confirmation window relies on. An edge proves order, not freshness. A receive gap between two command frames longer than the watchdog window is a stall in every state, measured on the daemon's own clock, never a client timestamp. After a stall the edge detector holds for one more window from the first late frame, so frames that drain in a burst cannot release or press, even when the burst holds a release then a press at zero throttle. A stall while DRIVING latches on the late frame. Each stall is logged. Heartbeats do not close a gap.

