; ARGUS build of the drive module firmware 4.1.5: the vendor's 4.1.4 plus
; the silence and feedback watchdog. src/ is byte for byte the tree the
; team was given and flashed on 14 Oct 2026. The platform is pinned to the
; one that built that binary.
;
; Build:  pio run            (binary: .pio/build/esp32s3/firmware.bin)
; Flash:  pio run -t upload --upload-port /dev/serial/by-id/<drive module>
;         Opening the port resets the board. Human at the key, wheels up,
;         typed go, nothing else (CLAUDE.md rule zero).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
