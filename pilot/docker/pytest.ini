# Test settings inside the container only.
#
# ROS2 Humble ships pytest plugins (`launch_testing`, `launch_testing_ros`)
# written against hook signatures that predate current pytest, and loading
# them aborts collection before any of our tests run. These tests need no
# third-party plugins at all, so autoloading is switched off entirely in the
# compose entry rather than naming each broken plugin as it is discovered.
[pytest]
testpaths = pilot/ros/tests
