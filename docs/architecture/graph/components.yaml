# Every engineering component of Argus, populated from the repository as of
# main @ 3c26521 plus the 18 Aug 2026 architecture reconciliation.
# Schema and maturity/disposition vocabulary: see README.md in this directory.
# Statuses follow law 17: claim only what evidence supports.

components:

  # ---------------------------------------------------------------- platform
  - id: platform.link
    name: ARGUS LINK
    type: Component
    path: link/
    plane: platform
    role: The frozen v1 contract; protobuf ontology (8 objects) plus 5 wire messages, Python and TypeScript bindings
    status: software_verified
    disposition: keep
    tests: [tests/test_sim_loop.py, scripts/verify_link.py]
    notes: CI runs buf breaking against the link-v1 tag. Never change without a version plan (ADR required). The open-struct conventions are recorded and versioned in link/CONVENTIONS.md (18 Aug 2026); new conventions land there in the same change that ships them.

  - id: platform.track
    name: ARGUS TRACK
    type: Service
    path: track/
    plane: platform
    role: Fleet world model server; MQTT ingest, fusion, zones, events, tasks, autonomy modes, REST/WS
    status: software_verified
    disposition: keep
    tests: [tests/test_api.py, tests/test_fusion.py, tests/test_zones_and_language.py, tests/test_sim_loop.py, tests/test_preview_and_systems.py, tests/test_tiles.py]
    known_gaps:
      - Single station, SQLite single-writer, full-scan association; fine for one site, not a dense theater
      - Provisional identity is convention only; indistinguishable from resolved identity on the wire
    notes: Target direction expands it toward Maven-like fleet intelligence (phase 7) without making it required for local execution. TRACK serves a local MBTiles cache (empty until tiles are sourced).

  - id: platform.c2
    name: ARGUS C2
    type: Application
    path: c2/
    plane: platform
    role: Operator application; Operate (map, fleet rail, event feed, assistant, autonomy modes), Drive hosted in a frame, local imagery layer
    status: software_verified
    disposition: keep
    tests: [c2/src/ui/Operate.test.tsx, c2/src/ui/Assistant.test.tsx, c2/src/ui/App.test.tsx, c2/src/ui/wording.test.ts, c2/src/ui/driveUrl.test.ts, c2/src/ui/driveAddress.test.ts, c2/src/state/world.test.ts, c2/src/map/frame.test.ts]
    known_gaps:
      - Gate-2 closed 10 Sep 2026; the approved redesign is being built (Argus_Wiki/program/c2-build-plan.md). M1 and M2 Operate are software_verified (vitest, CI job operator-application); M3 Drive is built but in progress
      - M3 Drive is proven by tests only. It has not been driven in a real browser inside C2 yet
      - Bearer token stored in localStorage (a refused token now returns to sign-in; storage itself unchanged)
      - Imagery tiles carry the bearer token as a query parameter (browsers cannot set headers on images); it lands in request logs and the browser cache. Same debt as the stream's token.
      - No video pane; WebRTC documented but nonexistent anywhere
    notes: Operate was rebuilt to the approved design (M2). The 12 Oct 2026 change pass (founder decision) gave the map the room. The camera and readings are one strip under it. Vehicle systems and recent activity are two tabs on the fleet rail. The first map frame is the site zones, else the answering machines, else the machines heard within a day. The launcher offers only Operate, Drive and Settings, and Settings only Appearance and Time. The link reading says when the machine was last heard, because the world model carries no latency. The assistant folds to its rail while the voice service is unreachable and opens again when it answers. The assistant previews one task, shows the five server checks with their sources, and sends only after the readback is confirmed. Drive hosts drive/cockpit in an iframe and tells it when Drive is the active screen; leaving Drive relinquishes control (founder decision, 12 Oct 2026). On sign-out C2 posts active=false and then argus.drive.signout to the frame at the cockpit origin, before the frame is removed; the cockpit side of that message is another change. The Drive address comes from localStorage, then VITE_DRIVE_URL in c2/.env.local; no bridge key is accepted from configuration. The page drops any key parameter, covered by vitest. The build drops it too, shown by a canary build on 12 Oct 2026 but not by a test. The cockpit asks for the key. Esc pressed inside the cockpit returns to the desktop through a message C2 accepts only from that frame and origin. The map draws imagery from TRACK's local MBTiles cache when one is present. Target adds brain state, diagnostics, explainability, and goal-based fleet queries (phase 7). Vitest suite and ESLint run in their own CI job.

  - id: platform.design
    name: Design tokens
    type: Component
    path: design/
    plane: platform
    role: The one visual language (colours, radii, type) shared by every application; a CSS file both c2/ and drive/cockpit/ import
    status: software_verified
    disposition: keep
    known_gaps: []
    notes: Source is the Gate-2 canvas confirmed 10 Sep 2026. Day variant included. Fonts are bundled from @fontsource (OFL), no CDN.

