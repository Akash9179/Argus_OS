# Nav2 for a machine with no map and no obstacle sensors yet.
#
# Stage 3A proves the path from an order to wheels turning, not obstacle
# avoidance. So the costmaps carry no static layer and no obstacle layer:
# the world is open ground, and the planner's job is to produce a route
# through it that the controller follows. The layers are named here rather
# than left out, so Stage 3B adds a voxel layer fed by the ZED driver by
# editing this file rather than by discovering what was missing.
#
# use_sim_time is false throughout. The machine runs on its own clock, in a
# container, with no simulator supplying time.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 2.0
      yaw_goal_tolerance: 6.28   # arriving matters; facing does not, yet
      stateful: true

    # MPPI, as the plan specifies.
    #
    # The values below are defaults only, and none of them is what any
    # machine actually runs on. Everything here that describes a body
    # rather than the algorithm (vx_max, wz_max, ax_max, ax_min, az_max,
    # min_turning_r, the smoother's velocity and acceleration limits, and
    # the costmap footprints) is overwritten at boot from the capability
    # manifest by Nav2Navigator.apply_manifest, which reports any that Nav2
    # refused so the machine can say it is running on numbers not its own.
    # Leaving one machine's numbers here as the operative values would put
    # a body's dimensions above the hardware abstraction layer, which is
    # exactly what the HAL law forbids.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      # Wide enough that sampling actually explores the machine's top
      # speed. Narrow deviation keeps the controller near a standstill no
      # matter how high vx_max is set.
      vx_std: 0.6
      wz_std: 0.5
      vx_max: 4.0
      # No reverse. Nav2 will happily drive a differential machine
      # backwards forever if reversing is ever cheaper than turning, which
      # leaves a camera pointed away from wherever the machine is going.
      # A machine that must reverse to reach a goal should turn first.
      vx_min: 0.0
      wz_max: 1.9
      ax_max: 2.5
      ax_min: -2.5
      az_max: 3.2
      iteration_count: 1
      motion_model: "DiffDrive"
      visualize: false
      AckermannConstraints:
        min_turning_r: 0.0
      critics:
        - "ConstraintCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PreferForwardCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.25
      # Footprint from the reference machine's manifest. The runtime
      # overrides it at boot from whichever manifest actually booted.
      robot_radius: 1.6
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 1.6
      resolution: 0.5
      # Rolling rather than anchored to a static map: there is no map
      # server, because there is no survey of the site. Stage 3B replaces
      # this with real ground truth when there is some.
      rolling_window: true
      width: 400
      height: 400
      track_unknown_space: false
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 2.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 2.0
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [4.0, 0.0, 1.9]
    min_velocity: [-1.0, 0.0, -1.9]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
