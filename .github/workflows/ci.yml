# The simulated vehicle runs against every change to the contract or the
# world model. A commit that breaks its full task loop is a broken commit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract compiles and stays frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install code generation plugins
        working-directory: link
        run: npm ci
      - name: Lint the contract
        working-directory: link
        run: buf lint
      - name: Refuse changes that break the frozen contract
        working-directory: link
        run: buf breaking --against '../.git#tag=link-v1,subdir=link'
      - name: Typecheck the TypeScript bindings
        working-directory: link
        run: npm run typecheck

  loop:
    name: "The full loop: sim, edge runtime, voice, and the sovereignty laws"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e link/
      # Deliberately NOT installing requirements-bench.txt. CI runs the
      # shape a deployed system ships in: no cloud language client, so the
      # cloud adapter never registers. If a test ever needs it to pass,
      # that test has become a test of the bench rather than of the
      # product.
      - name: Run the loop
        run: python -m pytest -q

  operator-application:
    name: "The operator application: typecheck, behaviour, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: c2
        run: npm ci
      - name: Typecheck
        working-directory: c2
        run: npm run typecheck
      # Two real bugs sat in the mode switch until a live browser session
      # found them, because typecheck was the only gate C2 had. The
      # behaviour tests exist so a browser is never again the only thing
      # standing between a bug like that and an operator.
      - name: Behaviour
        working-directory: c2
        run: npm test
      - name: Build
        working-directory: c2
        run: npm run build

  edge-runtime:
    name: The edge runtime against a real ROS2 graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime image
        run: docker build -f drive/pilot/docker/Dockerfile -t argus-pilot:ci .
      # The bridge and the Nav2 route are the parts that cannot be proven
      # without ROS2 running, so they run here rather than in the fast loop
      # above. A machine that navigates only in a unit test is not a
      # machine that navigates.
      - name: Bridge and Nav2 route
        run: |
          docker run --rm -e ROS_DOMAIN_ID=42 argus-pilot:ci \
            bash /opt/argus/pilot/docker/run_nav2_tests.sh pilot/ros/tests -q
