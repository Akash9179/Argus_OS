# What the edge runtime says about its own orders.
#
# The contract defines the task status message as operator-visible plain
# language, so these words reach a person. They live here rather than in
# runtime code, which means a deployment can change how its machines speak
# without reflashing them.
#
# Plain words only. Never blame the operator, and never claim to have done
# something that was not done.

messages:
  accepted: "Order received."
  running: "On the way."
  # A machine holding position is not on the way anywhere; saying so
  # would be a small lie, and the honesty law does not do small lies.
  holding: "Holding position."
  finished: "Finished."
  cancelled: "Order cancelled."
  # Refusals. A machine that cannot carry out an order says so; it never
  # accepts an order it will not perform, and never drops one silently.
  cannot_do_that: "This machine cannot do that."
  no_destination: "The order did not say where to go."
  # Given up part way. Says what happened without inventing a reason the
  # machine does not have.
  could_not_finish: "Could not get there. The machine has stopped."
  # The process restarted while an order was running. The machine never
  # resumes motion on its own after a restart; it says so and waits.
  interrupted: "Restarted during this order. The machine has stopped and is waiting for new orders."
