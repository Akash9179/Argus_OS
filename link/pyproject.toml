# Packaging for the generated Python bindings of the LINK contract.
# This is packaging only: it does not touch the frozen schema. It exists so
# every consumer (the world model server, the simulated vehicle, and any
# future partner) installs the contract as a normal dependency instead of
# reaching into this directory by path.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "link-contract"
version = "1.0.0"
description = "LINK contract: ontology and wire message schemas, generated Python bindings."
# 3.10, not 3.11, because the edge runtime installs this package and ROS2
# Humble is pinned to Ubuntu 22.04 and Python 3.10. The generated bindings
# use no syntax newer than 3.8; the old floor was inherited from the
# server's interpreter rather than being a requirement of the contract.
# This is packaging metadata, not schema: the frozen protos are untouched.
requires-python = ">=3.10"
dependencies = ["protobuf>=5.28"]

[tool.setuptools]
package-dir = {"" = "gen/python"}

[tool.setuptools.packages.find]
where = ["gen/python"]
