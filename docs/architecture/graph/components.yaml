    type: Service
    path: null
    plane: platform
    role: Local-first incremental event sync between machine journals and fleet storage, cursor-based
    status: planned
    disposition: new
    notes: The offline observation queue in edge.link_client is the behavioral seed. Full design in ARCHITECTURE.md and the alignment report section 25.

