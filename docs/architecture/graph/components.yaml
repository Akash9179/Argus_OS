  # ------------------------------------------------------------------ bodies
  - id: bodies.ugv01
    name: ugv-01 hardware truth
    type: Hardware
    path: bodies/ugv-01/
    plane: hardware
    role: The first steel; findings, protocol notes, wiring, firmware. Since 13 Oct 2026 the serial path is an ARGUS DRIVE v4.1.4 module (CH340) plus an accelerator board v1.2 (FTDI); the Arduino relay path the August pages describe is no longer on the wire
    status: scaffolded
    disposition: keep
    known_gaps:
      - Neither new board has a demonstrated firmware watchdog; the accelerator latches its last duty per the team's own code; link-loss behaviour of the drive module is undocumented
      - The 4.1.3 spec contradicts itself on steer left/right (0x05 01) and brake stop/release (0x06 00); the bench must settle both
      - Firmware sources for both boards are not in any checkout; STATUS (0x16) reply format and RESET defaults unknown
      - MCU-PROTOCOL.md, BENCH.md and the August FINDINGS describe the superseded relay path; kept as history
    blockers:
      - Bench verification of the two new boards (bodies/ugv-01/FINDINGS-2026-10-13.md section 7), wheels off the ground, one command at a time, with pilot/hal/drivers/ugv01/bench.py
      - A proven stop on link loss on both boards (firmware watchdog or an independent stop) before any autonomous motion (ARCHITECTURE.md section 6)

  - id: bodies.ugv01.firmware_v4
    name: v4 watchdog firmware
    type: Firmware
    path: bodies/ugv-01/firmware/
