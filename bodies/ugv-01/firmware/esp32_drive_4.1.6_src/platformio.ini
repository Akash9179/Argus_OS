; ARGUS build of the drive module firmware 4.1.6: the vendor's 4.1.4 plus
; the silence and feedback watchdog (4.1.5, 14 Oct 2026) with its authority
; narrowed to motion commands and the 0x15 keepalive (15 Oct 2026). The
; platform is pinned to the one that built the 4.1.5 binary on the vehicle.
;
; Build:  pio run            (binary: .pio/build/esp32s3/firmware.bin)
; Flash:  pio run -t upload --upload-port /dev/serial/by-id/<drive module>
;         Opening the port resets the board. Human at the key, wheels up,
;         typed go, nothing else (CLAUDE.md rule zero).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
